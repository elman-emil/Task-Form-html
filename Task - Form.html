<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Form</title>
</head>
<body>

<h1>Form</h1>

<form action="/action_page.php" method="get" target="_self" enctype="multipart/form-data">
  <fieldset>
    <legend>Personal information</legend>

    <table>
      <tr>
        <td><label for="fname">First name:</label></td>
        <td><input type="text" id="fname" name="fname" placeholder="First name"></td>
      </tr>

      <tr>
        <td><label for="lname">Last name:</label></td>
        <td><input type="text" id="lname" name="lname" placeholder="Last name"></td>
      </tr>

      <tr>
        <td><label for="email">Email:</label></td>
        <td><input type="email" id="email" name="email" placeholder="you@example.com"></td>
      </tr>

      <tr>
        <td><label for="phone">Phone:</label></td>
        <td><input type="tel" id="phone" name="phone" placeholder="+358 40 1234567"></td>
      </tr>

      <tr>
        <td>Gender:</td>
        <td>
          <input type="radio" id="gender_m" name="gender" value="male">
          <label for="gender_m">Male</label>

          <input type="radio" id="gender_f" name="gender" value="female">
          <label for="gender_f">Female</label>

          <input type="radio" id="gender_o" name="gender" value="other">
          <label for="gender_o">Other</label>
        </td>
      </tr>

      <tr>
        <td>Interests:</td>
        <td>
          <input type="checkbox" id="int_sports" name="interests" value="sports">
          <label for="int_sports">Sports</label>

          <input type="checkbox" id="int_music" name="interests" value="music">
          <label for="int_music">Music</label>

          <input type="checkbox" id="int_reading" name="interests" value="reading">
          <label for="int_reading">Reading</label>
        </td>
      </tr>

      <tr>
        <td><label for="message">About you:</label></td>
        <td><textarea id="message" name="message" rows="6" cols="50" placeholder="Write something about yourself..."></textarea></td>
      </tr>

      <tr>
        <td><label for="file">Upload file:</label></td>
        <td><input type="file" id="file" name="file"></td>
      </tr>

      <tr>
        <td colspan="2"><input type="submit" value="Send"></td>
      </tr>
    </table>

  </fieldset>
</form>

</body>
</html>
